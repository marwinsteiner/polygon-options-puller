[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polygon-options-puller"
version = "0.1.0"
description = "Download Polygon (Massive) options flat files from S3 and store as compressed Parquet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "marwi" }]
keywords = ["polygon", "massive", "options", "parquet", "market-data", "OPRA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "boto3>=1.28",
    "pyarrow>=14.0",
    "click>=8.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
polygon-options-puller = "polygon_options_puller.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/polygon_options_puller"]

[tool.ruff]
target-version = "py310"
line-length = 100
